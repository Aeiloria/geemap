name: Publish Docker image

on:
    release:
        types: [published]

jobs:
    push_to_registries:
        name: Push Docker image to multiple registries
        runs-on: ubuntu-latest
        permissions:
            packages: write
            contents: read
        steps:
            - name: Check out the repo
              uses: actions/checkout@v7

            - name: Log in to Docker Hub
              uses: docker/login-action@v4
              with:
                  username: ${{ secrets.DOCKER_USERNAME }}
                  password: ${{ secrets.DOCKER_PASSWORD }}

            - name: Log in to the Container registry
              uses: docker/login-action@v4
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Extract metadata (tags, labels) for Docker
              id: meta
              uses: docker/metadata-action@v6
              with:
                  images: |
                      giswqs/geemap
                      ghcr.io/${{ github.repository }}

            - name: Report deploy start to Rollouts
              id: rollouts
              env:
                  CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
                  CHANGE_MONITOR_ENV: push_to_registries
                  CHANGE_MONITOR_SERVICE: geemap
                  DEPLOY_VERSION: ${{ github.sha }}
                  CHANGE_MONITOR_ACTOR: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
              run: |
                  bash .github/scripts/rollouts-reporter.sh bootstrap
                  bash .github/scripts/rollouts-reporter.sh start
            - name: Build and push Docker images
              id: ship
              uses: docker/build-push-action@v7
              with:
                  context: .
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
            - name: Report deploy finish to Rollouts
              if: always()
              env:
                  CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
                  CHANGE_MONITOR_ENV: push_to_registries
                  CHANGE_MONITOR_SERVICE: geemap
                  DEPLOY_VERSION: ${{ github.sha }}
                  CHANGE_MONITOR_ACTOR: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
                  ROLLOUTS_DEPLOYMENT: ${{ steps.rollouts.outputs.deployment }}
                  ROLLOUTS_OUTCOME: ${{ steps.ship.outcome }}
              run: bash .github/scripts/rollouts-reporter.sh finish
